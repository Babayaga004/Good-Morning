<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>good morning 🐱</title>
<meta name="description" content="Click the link. Get flooded with good morning messages and silly cat photos." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🐱</text></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
/* ==========================================================================
   GOOD MORNING POPUP FLOOD — pink/violet, screen fills with cats
   ========================================================================== */

:root {
  --hot-pink: #FF3E9A;
  --pink-soft: #FFB6D9;
  --violet: #8B3DE0;
  --violet-deep: #5B1FA6;
  --bg-1: #2A0E52;
  --bg-2: #B23DD1;
  --bg-3: #FF6FB5;
  --paper: #FFFBF3;
  --text-dark: #2A0E52;
  --radius: 12px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --font-display: 'Baloo 2', sans-serif;
  --font-body: 'Poppins', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-body);
  color: var(--text-dark);
  min-height: 100vh;
  overflow-x: hidden;
  background: linear-gradient(155deg, var(--bg-1), var(--bg-2) 55%, var(--bg-3));
}

button { cursor: pointer; font-family: inherit; }
::selection { background: var(--hot-pink); color: #fff; }

/* ---------- Landing ---------- */
.landing { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.landing-inner { text-align: center; max-width: 460px; }
.eyebrow { font-family: var(--font-body); font-weight: 600; letter-spacing: 2px; text-transform: uppercase; font-size: 0.75rem; color: rgba(255,255,255,0.65); margin-bottom: 18px; }
.trigger-link {
  border: none; background: rgba(255,255,255,0.12); backdrop-filter: blur(10px);
  color: #fff; font-family: var(--font-display); font-weight: 700; font-size: clamp(1.1rem, 4vw, 1.6rem);
  padding: 24px 34px; border-radius: 50px; border: 2px solid rgba(255,255,255,0.3);
  box-shadow: 0 20px 50px rgba(0,0,0,0.3); transition: transform 0.3s var(--ease), background 0.3s var(--ease);
  animation: pulseGlow 2.2s ease-in-out infinite;
}
.trigger-link:hover { transform: translateY(-4px) scale(1.03); background: rgba(255,255,255,0.2); }
.trigger-link:active { transform: scale(0.96); }
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 20px 50px rgba(0,0,0,0.3), 0 0 0 0 rgba(255,255,255,0.25); }
  50% { box-shadow: 0 20px 50px rgba(0,0,0,0.3), 0 0 0 14px rgba(255,255,255,0); }
}
.hint { margin-top: 22px; font-size: 0.8rem; color: rgba(255,255,255,0.55); }

/* ---------- Popup layer ---------- */
.popup-layer { position: fixed; inset: 0; z-index: 10; overflow: hidden; }

body.shaking { animation: screenShake 0.4s ease-in-out 2; }
@keyframes screenShake {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(-6px, 4px); }
  40% { transform: translate(6px, -4px); }
  60% { transform: translate(-4px, -6px); }
  80% { transform: translate(4px, 6px); }
}

.popup {
  position: absolute; width: 220px; background: var(--paper); border-radius: var(--radius);
  overflow: hidden; box-shadow: 0 16px 34px rgba(0,0,0,0.4);
  animation: popIn 0.3s var(--ease) forwards;
  transform-origin: center;
}
@keyframes popIn {
  0% { transform: scale(0.15) rotate(var(--rot, 0deg)); opacity: 0; }
  65% { transform: scale(1.07) rotate(var(--rot, 0deg)); opacity: 1; }
  100% { transform: scale(1) rotate(var(--rot, 0deg)); opacity: 1; }
}
.popup-bar {
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(90deg, var(--hot-pink), var(--violet)); padding: 6px 8px;
}
.popup-title { font-size: 0.64rem; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-body); }
.popup-close { border: none; background: rgba(255,255,255,0.28); color: #fff; width: 18px; height: 18px; border-radius: 4px; font-size: 0.6rem; line-height: 1; flex-shrink: 0; }
.popup-close:hover { background: rgba(255,255,255,0.5); }

.popup-body { padding: 8px; text-align: center; }
.popup-img-wrap { position: relative; width: 100%; height: 160px; border-radius: 8px; overflow: hidden; background: linear-gradient(135deg, var(--pink-soft), #E7D2FF); display: flex; align-items: center; justify-content: center; }
.popup-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.popup-fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 3rem; }
.popup-img-wrap.img-failed .popup-img { display: none; }
.popup-img-wrap.img-failed .popup-fallback { display: flex; }
.popup-caption { margin-top: 8px; font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; color: var(--violet-deep); }

/* ---------- Cleanup button ---------- */
.cleanup-btn {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  z-index: 20; border: none; padding: 15px 28px; border-radius: 50px; font-weight: 700; font-size: 0.9rem;
  background: rgba(255,255,255,0.94); color: var(--violet-deep); box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  animation: cleanupPulse 1.6s ease-in-out infinite;
}
@keyframes cleanupPulse { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } }

/* ---------- Responsive ---------- */
@media (max-width: 480px) {
  .popup { width: 160px; }
  .popup-img-wrap { height: 120px; }
  .popup-caption { font-size: 0.72rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

  </style>
</head>
<body>

  <!-- ===== Landing: the link she clicks ===== -->
  <main class="landing" id="landing">
    <div class="landing-inner">
      <p class="eyebrow">a very important message</p>
      <button class="trigger-link" id="triggerBtn">☀️ click here for a good morning ☀️</button>
      <p class="hint">(turn your volume down, this gets loud with cats)</p>
    </div>
  </main>

  <!-- ===== Popup flood layer ===== -->
  <div class="popup-layer" id="popupLayer" hidden></div>

  <!-- Appears once the screen is full -->
  <button class="cleanup-btn" id="cleanupBtn" hidden>🧹 okay that's enough</button>

  <!-- Reusable popup template -->
  <template id="popupTemplate">
    <div class="popup">
      <div class="popup-bar">
        <span class="popup-title">good_morning.jpg</span>
        <button class="popup-close" aria-label="Close">✕</button>
      </div>
      <div class="popup-body">
        <div class="popup-img-wrap">
          <img class="popup-img" alt="a silly cat saying good morning" loading="lazy" />
          <span class="popup-fallback">🐱</span>
        </div>
        <p class="popup-caption"></p>
      </div>
    </div>
  </template>

  function catImageUrl(caption, seed) {
    // cataas.com bakes the caption directly onto a random cat photo.
    // The seed query param busts the cache so each popup gets a fresh image.
    const encoded = encodeURIComponent(caption);
    return `https://cataas.com/cat/says/${encoded}?fontSize=42&fontColor=white&width=320&height=300&_=${seed}`;
  }

  function pickImageSrc(caption, seed) {
    // Mostly show your own uploaded cats; occasionally mix in a random
    // online cat for variety. Adjust the 0.7 to change the ratio.
    if (LOCAL_CATS.length > 0 && Math.random() < 0.7) {
      return LOCAL_CATS[Math.floor(Math.random() * LOCAL_CATS.length)];
    }
    return catImageUrl(caption, seed);
  }

  const isSmallScreen = window.matchMedia('(max-width: 600px)').matches;
  const TOTAL_POPUPS = isSmallScreen ? 24 : 44;
  const BOX_W = isSmallScreen ? 160 : 220;
  const BOX_H = isSmallScreen ? 150 : 210;

  let spawned = 0;
  let livePopups = [];
  let spawnTimer = null;

  /* ---------------- Pop sound (synthesized, no audio file needed) ---------------- */
  let audioCtx = null;
  function unlockAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playPop() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    // Quick upward "boop" — high-pitched cartoon pop, pitch varies per popup
    const startFreq = 480 + Math.random() * 260;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(startFreq, now);
    osc.frequency.exponentialRampToValueAtTime(startFreq * 2.4, now + 0.07);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.22, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);

    osc.start(now);
    osc.stop(now + 0.14);
  }

  function playSweep() {
    // One low "whoosh" when the flood begins
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.4);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.15, now + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
    osc.start(now);
    osc.stop(now + 0.45);
  }

  function playCloseBlip() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(500, now);
    osc.frequency.exponentialRampToValueAtTime(220, now + 0.09);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.14, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
    osc.start(now);
    osc.stop(now + 0.1);
  }

  function playChime() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    [660, 880, 1100].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      const start = now + i * 0.09;
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.18, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
      osc.start(start);
      osc.stop(start + 0.3);
    });
  }

  function spawnPopup() {
    const frag = popupTemplate.content.cloneNode(true);
    const popup = frag.querySelector('.popup');
    const titleEl = frag.querySelector('.popup-title');
    const closeEl = frag.querySelector('.popup-close');
    const imgWrap = frag.querySelector('.popup-img-wrap');
    const imgEl = frag.querySelector('.popup-img');
    const captionEl = frag.querySelector('.popup-caption');

    const caption = randomCaption();
    const seed = `${Date.now()}_${spawned}_${Math.floor(Math.random() * 100000)}`;

    titleEl.textContent = `good_morning_${spawned + 1}.jpg`;
    captionEl.textContent = caption;
    imgEl.src = pickImageSrc(caption, seed);
    imgEl.addEventListener('error', () => imgWrap.classList.add('img-failed'));

    const maxX = Math.max(0, window.innerWidth - BOX_W);
    const maxY = Math.max(0, window.innerHeight - BOX_H);
    const x = Math.random() * maxX;
    const y = Math.random() * maxY;
    const rot = (Math.random() * 26 - 13).toFixed(1);

    popup.style.left = x + 'px';
    popup.style.top = y + 'px';
    popup.style.setProperty('--rot', rot + 'deg');
    popup.style.zIndex = 10 + spawned;

    closeEl.addEventListener('click', (e) => {
      e.stopPropagation();
      playCloseBlip();
      popup.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
      popup.style.transform = `scale(0) rotate(${rot}deg)`;
      popup.style.opacity = '0';
      setTimeout(() => popup.remove(), 200);
      livePopups = livePopups.filter((p) => p !== popup);
    });

    popupLayer.appendChild(popup);
    livePopups.push(popup);
    spawned++;
    playPop();
  }

  function startFlood() {
    unlockAudio();
    landing.style.display = 'none';
    popupLayer.hidden = false;
    popupLayer.innerHTML = '';
    livePopups = [];
    spawned = 0;
    cleanupBtn.hidden = true;

    playSweep();
    document.body.classList.add('shaking');
    setTimeout(() => document.body.classList.remove('shaking'), 800);

    spawnTimer = setInterval(() => {
      const batch = Math.random() < 0.5 ? 2 : 3;
      for (let i = 0; i < batch && spawned < TOTAL_POPUPS; i++) spawnPopup();
      if (spawned >= TOTAL_POPUPS) {
        clearInterval(spawnTimer);
        setTimeout(() => { cleanupBtn.hidden = false; }, 400);
      }
    }, 160);
  }

  triggerBtn.addEventListener('click', startFlood);

  cleanupBtn.addEventListener('click', () => {
    livePopups.forEach((popup, i) => {
      setTimeout(() => {
        popup.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
        popup.style.transform = 'scale(0) rotate(0deg)';
        popup.style.opacity = '0';
      }, i * 12);
    });
    cleanupBtn.hidden = true;
    playChime();
    setTimeout(() => {
      popupLayer.hidden = true;
      popupLayer.innerHTML = '';
      landing.style.display = 'flex';
    }, 700);
  });

});

  </script>
</body>
</html>
